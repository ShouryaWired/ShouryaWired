<svg xmlns="http://www.w3.org/2000/svg" width="440" height="96" viewBox="0 0 440 96">
  <style>
    :root {
      --name: #FDF5E9;
      --accent: #E07B4C;
      --muted: #8B949E;
    }
    @media (prefers-color-scheme: light) {
      :root {
        --name: #1F2328;
        --accent: #C2562A;
        --muted: #57606A;
      }
    }

    .name {
      font-family: Impact, Haettenschweiler, 'Arial Narrow Bold', 'Franklin Gothic Condensed', sans-serif;
      font-size: 32px;
      font-weight: 400;
      letter-spacing: 1px;
      fill: var(--name);
    }
    .user {
      font-family: 'JetBrains Mono', 'Fira Code', 'SF Mono', Menlo, Consolas, 'Courier New', monospace;
      font-size: 13px;
      font-weight: 700;
      fill: var(--accent);
    }
    .bio {
      font-family: 'JetBrains Mono', 'Fira Code', 'SF Mono', Menlo, Consolas, 'Courier New', monospace;
      font-size: 15px;
      font-weight: 400;
      fill: var(--muted);
    }

    .c1 { animation: wipe1 0.8s cubic-bezier(0.22, 1, 0.36, 1) 0.1s forwards; }
    .c2 { animation: wipe2 0.7s cubic-bezier(0.22, 1, 0.36, 1) 0.4s forwards; }
    .c3 { animation: wipe3 0.9s cubic-bezier(0.22, 1, 0.36, 1) 0.7s forwards; }
    .cur {
      animation: move 0.9s cubic-bezier(0.22, 1, 0.36, 1) 0.7s forwards, blink 1.1s ease-in-out 1.6s infinite;
    }

    @keyframes wipe1 { from { width: 0; } to { width: 240px; } }
    @keyframes wipe2 { from { width: 0; } to { width: 120px; } }
    @keyframes wipe3 { from { width: 0; } to { width: 255px; } }
    @keyframes move {
      from { transform: translateX(0); }
      to   { transform: translateX(254px); }
    }
    @keyframes blink {
      0%, 100% { opacity: 1; }
      50%      { opacity: 0; }
    }
  </style>

  <defs>
    <clipPath id="k1"><rect class="c1" x="16" y="0" height="96" width="0" /></clipPath>
    <clipPath id="k2"><rect class="c2" x="16" y="0" height="96" width="0" /></clipPath>
    <clipPath id="k3"><rect class="c3" x="16" y="0" height="96" width="0" /></clipPath>
  </defs>

  <text x="16" y="32" class="name" clip-path="url(#k1)">Shourya Mishra</text>
  <text x="16" y="45" class="user" clip-path="url(#k2)">@ShouryaWired</text>
  <text x="16" y="70" class="bio" clip-path="url(#k3)">I like Computers & Machines.</text>

  <rect class="cur" x="16" y="57" width="7" height="15" rx="1" fill="#E07B4C" />
</svg>
