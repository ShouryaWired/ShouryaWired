<svg xmlns="http://www.w3.org/2000/svg" width="440" height="96" viewBox="0 0 440 96">
  <style>
    /* ---------- colors (dark default, light mode adapts) ---------- */
    :root {
      --name: #FDF5E9;
      --accent: #E07B4C;
      --muted: #8B949E;
    }
    @media (prefers-color-scheme: light) {
      :root {
        --name: #1F2328;
        --accent: #C2562A;
        --muted: #57606A;
      }
    }

    /* ---------- fonts: condensed heavy name (matches banner), mono for the rest ---------- */
    .name {
      font-family: Impact, Haettenschweiler, 'Arial Narrow Bold', 'Franklin Gothic Condensed', sans-serif;
      font-size: 32px;
      font-weight: 400;
      letter-spacing: 1px;
      fill: var(--name);
    }

    .user {
      font-family: 'JetBrains Mono', 'Fira Code', 'SF Mono', Menlo, Consolas, 'Courier New', monospace;
      font-size: 13px;
      font-weight: 700;
      fill: var(--accent);
    }
    .bio {
      font-family: 'JetBrains Mono', 'Fira Code', 'SF Mono', Menlo, Consolas, 'Courier New', monospace;
      font-size: 15px;
      font-weight: 400;
      fill: var(--muted);
    }

    /* ---------- animation: types once (3s), all three lines together, then stays ----------
       "1" = play one time, "forwards" = keep the final state (fully typed) */
    .c1 { animation: t1 3s 1 steps(14, end) forwards; }
    .c2 { animation: t2 3s 1 steps(13, end) forwards; }
    .c3 { animation: t3 3s 1 steps(27, end) forwards; }
    .cur {
      animation: move 3s 1 steps(27, end) forwards, blink 1s infinite step-end;
    }

    @keyframes t1 { from { width: 0; } to { width: 235px; } }
    @keyframes t2 { from { width: 0; } to { width: 112px; } }
    @keyframes t3 { from { width: 0; } to { width: 250px; } }
    @keyframes move {
      from { transform: translateX(0); }
      to   { transform: translateX(250px); }
    }
    @keyframes blink { 50% { opacity: 0; } }
  </style>

  <defs>
    <clipPath id="k1"><rect class="c1" x="16" y="0" height="96" width="0" /></clipPath>
    <clipPath id="k2"><rect class="c2" x="16" y="0" height="96" width="0" /></clipPath>
    <clipPath id="k3"><rect class="c3" x="16" y="0" height="96" width="0" /></clipPath>
  </defs>

  <!-- textLength pins each line to an exact width, so the layout stays the same whatever font the viewer has -->
  <text x="16" y="32" class="name" clip-path="url(#k1)">Shourya Mishra</text>
  <text x="16" y="45" class="user" clip-path="url(#k2)">@ShouryaWired</text>
  <text x="16" y="70" class="bio" clip-path="url(#k3)">I like Computers &amp; Machines.</text>

  <!-- blinking cursor that rides the typing edge of the bio line, then keeps blinking at the end -->
  <rect class="cur" x="16" y="57" width="7" height="15" rx="1" fill="#E07B4C" />
</svg>
