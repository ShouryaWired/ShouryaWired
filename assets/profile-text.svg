<svg xmlns="http://www.w3.org/2000/svg" width="440" height="96" viewBox="0 0 440 96" xmlns:c2pa="http://c2pa.org/manifest">
  <style>
    /* ---------- colors (dark default, light mode adapts) ---------- */
    :root {
      --name: #FDF5E9;
      --accent: #E07B4C;
      --muted: #8B949E;
    }
    @media (prefers-color-scheme: light) {
      :root {
        --name: #1F2328;
        --accent: #C2562A;
        --muted: #57606A;
      }
    }

    /* ---------- fonts: condensed heavy name (matches banner), mono for the rest ---------- */
    .name {
      font-family: Impact, Haettenschweiler, 'Arial Narrow Bold', 'Franklin Gothic Condensed', sans-serif;
      font-size: 32px;
      font-weight: 400;
      letter-spacing: 1px;
      fill: var(--name);
    }
    .name .accent { fill: var(--accent); }

    .user {
      font-family: 'JetBrains Mono', 'Fira Code', 'SF Mono', Menlo, Consolas, 'Courier New', monospace;
      font-size: 13px;
      font-weight: 700;
      fill: var(--accent);
    }
    .bio {
      font-family: 'JetBrains Mono', 'Fira Code', 'SF Mono', Menlo, Consolas, 'Courier New', monospace;
      font-size: 15px;
      font-weight: 400;
      fill: var(--muted);
    }

    /* ---------- animation: all three share the same duration and keyframe percentages ----------
       type: 0% to 35%  |  hold: 35% to 90%  |  erase: 90% to 100%  */
    .c1 { animation: t1 8s infinite steps(14, end); }
    .c2 { animation: t2 8s infinite steps(13, end); }
    .c3 { animation: t3 8s infinite steps(27, end); }
    .cur {
      animation: move 8s infinite steps(27, end), blink 1s infinite step-end;
    }

    @keyframes t1 { 0% { width: 0; } 35% { width: 235px; } 90% { width: 235px; } 100% { width: 0; } }
    @keyframes t2 { 0% { width: 0; } 35% { width: 112px; } 90% { width: 112px; } 100% { width: 0; } }
    @keyframes t3 { 0% { width: 0; } 35% { width: 250px; } 90% { width: 250px; } 100% { width: 0; } }
    @keyframes move {
      0%   { transform: translateX(0); }
      35%  { transform: translateX(250px); }
      90%  { transform: translateX(250px); }
      100% { transform: translateX(0); }
    }
    @keyframes blink { 50% { opacity: 0; } }
  </style>

  <defs>
    <clipPath id="k1"><rect class="c1" x="16" y="0" height="96" width="0"/></clipPath>
    <clipPath id="k2"><rect class="c2" x="16" y="0" height="96" width="0"/></clipPath>
    <clipPath id="k3"><rect class="c3" x="16" y="0" height="96" width="0"/></clipPath>
  </defs>

  <!-- textLength pins each line to an exact width, so the layout stays the same whatever font the viewer has -->
  <text x="16" y="32" class="name" textLength="235" lengthAdjust="spacingAndGlyphs" clip-path="url(#k1)">Shourya <tspan class="accent">Mishra</tspan></text>
  <text x="16" y="45" class="user" textLength="112" lengthAdjust="spacing" clip-path="url(#k2)">@ShouryaWired</text>
  <text x="16" y="70" class="bio" textLength="250" lengthAdjust="spacing" clip-path="url(#k3)">I love Computers / Machines</text>

  <!-- blinking cursor that rides the typing edge of the bio line -->
  <rect class="cur" x="16" y="57" width="7" height="15" rx="1" fill="#E07B4C"/>
<metadata><c2pa:manifest></c2pa:manifest></metadata></svg>
